name: Debug macOS client

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug test 2 with trace
        run: |
          set +e
          chmod +x macos/tests/run-tests.sh macos/zapret-proxy.command macos/tests/stubs/* || true
          cd macos/tests
          # Run just test 2 scenario manually with tracing
          HERE=$(pwd)
          SCRIPT="$HERE/../zapret-proxy.command"
          STUBS="$HERE/stubs"
          SIM_ROOT=$(mktemp -d "${TMPDIR:-/tmp}/zapret-sim.XXXXXX")
          mkdir -p "$SIM_ROOT/home"
          export SIM_HOME="$SIM_ROOT/home"
          export SIM_USER="sdccd"
          export SIM_LOG="$SIM_ROOT/calls.log"
          export SIM_STATE="$SIM_ROOT/state.txt"
          export SIM_UID="501"
          export HOME="$SIM_HOME"
          export PATH="$STUBS:$PATH"
          : >"$SIM_LOG"
          : >"$SIM_STATE"
          echo "=== RUNNING: bash -x \$SCRIPT --on 192.168.1.50 ==="
          bash -x "$SCRIPT" --on 192.168.1.50
          echo "RC=$?"
          echo "=== SIM_LOG ==="
          cat "$SIM_LOG" || true
          echo "=== SIM_STATE ==="
          cat "$SIM_STATE" || true
          echo "=== CONF ==="
          cat "$SIM_HOME/Library/Application Support/ZapretControl/proxy.conf" 2>&1 || true
          echo "=== DONE ==="
